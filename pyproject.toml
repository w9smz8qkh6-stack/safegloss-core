[project]
name = "safegloss-core"
version = "0.1.0"
description = "Self-hosted multilingual glossary and exam-access support for schools"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "tests.py"]
testpaths = ["accounts", "core", "courses", "glossary", "tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
