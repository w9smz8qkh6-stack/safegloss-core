name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Documentation completion check
        env:
          SAFEGLOSS_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/check_documentation_updates.py
      - name: Generated documentation freshness
        run: python scripts/generate_documentation.py --check
      - name: Documentation links and ownership
        run: python scripts/check_documentation_links.py

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: safegloss_test
          POSTGRES_USER: safegloss
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U safegloss"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://safegloss@localhost:5432/safegloss_test
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,testserver
      SECURE_SSL_REDIRECT: "False"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python manage.py check
      - name: Django deployment check
        run: |
          export DJANGO_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(64))')"
          DEBUG=False \
          SECURE_SSL_REDIRECT=True \
          SECURE_HSTS_INCLUDE_SUBDOMAINS=True \
          SECURE_HSTS_PRELOAD=True \
          python manage.py check --deploy --fail-level WARNING
      - run: python manage.py makemigrations --check --dry-run
      - run: pytest
      - run: ruff check .
      - run: ruff format --check .

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --upgrade pip pip-audit
      - run: pip-audit -r requirements.txt

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --tag safegloss-core:ci .
      - name: Render production templates from the built image
        run: |
          docker run --rm \
            --env DJANGO_SECRET_KEY=unsafe-ci-only-key \
            --env DATABASE_URL=sqlite:////tmp/safegloss-ci.sqlite3 \
            --env ALLOWED_HOSTS=testserver \
            safegloss-core:ci \
            python manage.py shell -c \
            "from django.test import Client; client = Client(); assert client.get('/').status_code == 200; assert client.get('/accounts/login/').status_code == 200"
