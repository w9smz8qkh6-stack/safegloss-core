services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: safegloss
      POSTGRES_USER: safegloss
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safegloss"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  web:
    build: .
    command: >-
      sh -c "python manage.py migrate &&
      python manage.py seed_languages &&
      python manage.py runserver 0.0.0.0:8000"
    environment:
      DEBUG: "true"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgresql://safegloss@db:5432/safegloss
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres-data:
